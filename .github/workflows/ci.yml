name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Preset build (strict), Figma plugin, token contract and aegis-init CLI tests.
      # No dependencies to install: the repo has zero runtime dependencies.
      - run: npm test
      - name: Generated preset files are up to date
        run: git diff --exit-code

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_VERSION: 1.63.0
      AEGIS_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Playwright is test-only tooling, so it is installed here rather than added to package.json.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium
      - name: Browser integration tests
        run: npm run test:e2e
      - name: Simulator tests
        if: success() || failure()
        run: npm run test:simulator
      - name: Playground tests
        if: success() || failure()
        run: npm run test:playground
