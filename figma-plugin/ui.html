<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AegisUI Token Sync</title>
<style>
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --bg3: var(--figma-color-bg-tertiary, #e6e6e6);
    --fg: var(--figma-color-text, #1e1e1e);
    --fg2: var(--figma-color-text-secondary, #6b6b6b);
    --line: var(--figma-color-border, #e6e6e6);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --brand-fg: var(--figma-color-text-onbrand, #ffffff);
    --brand-text: var(--figma-color-text-brand, #007be5);
    --ok: var(--figma-color-text-success, #14ae5c);
    --bad: var(--figma-color-text-danger, #f24822);
    --warn: var(--figma-color-text-warning, #b86200);
    --sel: var(--figma-color-bg-selected, #e5f4ff);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 12px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  header h1 svg { width: 16px; height: 16px; color: var(--brand); }
  header p { margin: 2px 0 0; color: var(--fg2); }

  .tabs { display: flex; gap: 2px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); }
  .tab { border: 0; background: none; padding: 8px 10px; cursor: pointer; color: var(--fg2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }

  main { flex: 1; overflow-y: auto; padding: 12px 16px 16px; display: grid; gap: 14px; align-content: start; }
  .panel[hidden] { display: none; }

  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .preset { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; text-align: left; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer; min-width: 0; }
  .preset:hover { background: var(--bg2); }
  .preset[aria-checked="true"] { border-color: var(--brand); background: var(--sel); }
  .chip { width: 28px; height: 28px; border-radius: 6px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .chip i { display: block; }
  .preset b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preset small { color: var(--fg2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  textarea { width: 100%; min-height: 180px; resize: vertical; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .drop { display: grid; place-items: center; gap: 6px; text-align: center; padding: 28px 16px; border: 1.5px dashed var(--line); border-radius: 8px; color: var(--fg2); cursor: pointer; }
  .drop.is-over { border-color: var(--brand); background: var(--sel); color: var(--fg); }
  .drop strong { color: var(--fg); }
  .row { display: flex; gap: 8px; align-items: center; }

  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
  .card h2 { margin: 0; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stat { background: var(--bg2); border-radius: 6px; padding: 6px 8px; }
  .stat b { display: block; font-size: 14px; font-weight: 600; }
  .stat span { color: var(--fg2); font-size: 11px; }
  .pill { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); color: var(--fg2); white-space: nowrap; }
  .pill.ok { color: var(--ok); border-color: currentColor; }
  .pill.bad { color: var(--bad); border-color: currentColor; }
  .errors { margin: 0; padding-left: 16px; color: var(--bad); }
  .muted { color: var(--fg2); }

  .opts { display: grid; gap: 6px; }
  .opt { display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: start; cursor: pointer; }
  .opt input { margin: 2px 0 0; accent-color: var(--brand); }
  .opt span b { font-weight: 500; }
  .opt span small { display: block; color: var(--fg2); }
  .opt.sub { margin-left: 24px; }

  footer { border-top: 1px solid var(--line); padding: 10px 16px 12px; display: grid; gap: 8px; }
  .btn { height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--bg2); }
  .btn-primary { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); flex: 1; }
  .btn-primary:hover { background: var(--brand); filter: brightness(1.05); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .log { margin: 0; padding: 0; list-style: none; max-height: 120px; overflow-y: auto; font-size: 11px; display: grid; gap: 2px; }
  .log li { display: flex; gap: 6px; color: var(--fg2); }
  .log li.ok { color: var(--ok); }
  .log li.err { color: var(--bad); }
  .log li.warn { color: var(--warn); }
  .bar { height: 3px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--brand); transition: width .25s ease; }
</style>
</head>
<body>
  <header>
    <h1><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 6v6c0 5 3.8 9.3 9 10 5.2-.7 9-5 9-10V6l-9-4Z" fill="currentColor"/></svg>AegisUI Token Sync</h1>
    <p>Generate variables, styles and a living style guide from AegisUI JSON.</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-presets" aria-selected="true" aria-controls="p-presets">Presets</button>
    <button class="tab" role="tab" id="tab-paste" aria-selected="false" aria-controls="p-paste">Paste JSON</button>
    <button class="tab" role="tab" id="tab-file" aria-selected="false" aria-controls="p-file">Upload file</button>
  </nav>

  <main>
    <section class="panel" id="p-presets" role="tabpanel" aria-labelledby="tab-presets">
      <div class="presets" id="presets" role="radiogroup" aria-label="Built-in presets"></div>
    </section>

    <section class="panel" id="p-paste" role="tabpanel" aria-labelledby="tab-paste" hidden>
      <textarea id="json" spellcheck="false" placeholder='Paste the JSON from AegisUI Studio → "Copy JSON" (format "aegis-tokens")…' aria-label="AegisUI token JSON"></textarea>
    </section>

    <section class="panel" id="p-file" role="tabpanel" aria-labelledby="tab-file" hidden>
      <label class="drop" id="drop">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        <span><strong>Drop a .json file</strong> or click to browse</span>
        <span id="file-name" class="muted">presets/tokens/&lt;id&gt;.json or a Studio export</span>
        <input type="file" id="file" accept=".json,application/json" hidden>
      </label>
    </section>

    <section class="card" id="summary" aria-live="polite">
      <h2><span id="sum-title">No document loaded</span><span id="sum-pill" class="pill">—</span></h2>
      <div id="sum-body" class="muted">Pick a preset, paste JSON or upload a file.</div>
    </section>

    <section class="card">
      <h2>Generate</h2>
      <div class="opts">
        <label class="opt"><input type="checkbox" id="o-variables" checked><span><b>Local variables</b><small>Primitives · Semantic (Light/Dark) · Dimensions · Typography · Motion · Components</small></span></label>
        <label class="opt sub"><input type="checkbox" id="o-hide" checked><span><b>Hide primitives from publishing</b><small>Designers pick Semantic tokens; primitives stay as alias targets</small></span></label>
        <label class="opt"><input type="checkbox" id="o-text" checked><span><b>Text styles</b><small>16 styles; size &amp; line-height bound to variables</small></span></label>
        <label class="opt"><input type="checkbox" id="o-effects" checked><span><b>Effect styles</b><small>elevation/light/* and elevation/dark/*</small></span></label>
        <label class="opt"><input type="checkbox" id="o-guide" checked><span><b>Style guide page</b><small>Auto-layout foundations in Light and Dark</small></span></label>
        <label class="opt sub"><input type="checkbox" id="o-components" checked><span><b>Components &amp; token docs</b><small>Button, Badge, Input, Card components + recipe tables</small></span></label>
        <label class="opt"><input type="checkbox" id="o-namespace"><span><b>Namespace by preset name</b><small>Keep several presets side by side instead of updating one set in place</small></span></label>
      </div>
    </section>
  </main>

  <footer>
    <div class="bar" aria-hidden="true"><span id="bar"></span></div>
    <ul class="log" id="log" aria-live="polite"></ul>
    <div class="row">
      <button class="btn btn-primary" id="run" disabled>Generate in Figma</button>
      <button class="btn" id="close">Close</button>
    </div>
  </footer>

  function quickValidate(doc) {
    var e = [];
    if (!doc || typeof doc !== 'object') return ['Not a JSON object.'];
    if (!doc.aegis || doc.aegis.format !== 'aegis-tokens') e.push('Missing aegis.format = "aegis-tokens".');
    if (!doc.meta || !doc.meta.name) e.push('Missing meta.name.');
    if (!doc.tokens || !doc.tokens.primitive || !doc.tokens.semantic) e.push('Missing tokens.primitive / tokens.semantic.');
    if (!Array.isArray(doc.modes)) e.push('Missing "modes" array.');
    return e;
  }
  function showErrors(title, errs) {
    current = null;
    $('sum-title').textContent = title;
    $('sum-pill').className = 'pill bad'; $('sum-pill').textContent = 'Invalid';
    $('sum-body').innerHTML = '<ul class="errors">' + errs.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    $('run').disabled = true;
  }
  function setDoc(doc, source) {
    var errs = quickValidate(doc);
    if (errs.length) return showErrors('Not an AegisUI token document', errs);
    current = doc;
    var t = doc.tokens;
    var styles = t.typography && t.typography.textStyle ? Object.keys(t.typography.textStyle).length : 0;
    var a = doc.a11y;
    $('sum-title').textContent = doc.meta.name;
    $('sum-pill').className = 'pill ' + (a && a.pass ? 'ok' : a ? 'bad' : '');
    $('sum-pill').textContent = a ? 'WCAG ' + a.target + (a.pass ? ' ✓' : ' ✗') : 'No a11y report';
    $('sum-body').className = '';
    $('sum-body').innerHTML =
      '<div class="muted" style="margin-bottom:8px">' + esc(source) + ' · ' + esc(doc.meta.category || '') + ' · modes ' + doc.modes.join(' / ') + ' · v' + esc(doc.aegis.version) + '</div>' +
      '<div class="stats">' +
      stat(count(t.primitive), 'primitives') + stat(count(t.semantic), 'semantic × ' + doc.modes.length) + stat(count(t.dimension || {}), 'dimensions') +
      stat(styles, 'text styles') + stat(t.shadow ? Object.keys(t.shadow).length * doc.modes.length : 0, 'effect styles') + stat(count(t.component || {}), 'component tokens') +
      '</div>';
    $('run').disabled = running;
  }
  function stat(n, label) { return '<div class="stat"><b>' + n + '</b><span>' + esc(label) + '</span></div>'; }

  /* ── options ── */
  function opts() {
    return {
      variables: $('o-variables').checked,
      hidePrimitives: $('o-hide').checked,
      textStyles: $('o-text').checked,
      bindTextStyles: true,
      effectStyles: $('o-effects').checked,
      styleGuide: $('o-guide').checked,
      components: $('o-components').checked && $('o-guide').checked,
      namespace: $('o-namespace').checked,
    };
  }
  $('o-variables').addEventListener('change', function () { $('o-hide').disabled = !this.checked; });
  $('o-guide').addEventListener('change', function () { $('o-components').disabled = !this.checked; });

  /* ── run ── */
  function log(text, cls) {
    var li = document.createElement('li');
    if (cls) li.className = cls;
    li.textContent = text;
    $('log').appendChild(li);
    $('log').scrollTop = $('log').scrollHeight;
  }
  $('run').addEventListener('click', function () {
    if (!current || running) return;
    running = true;
    $('run').disabled = true;
    $('run').textContent = 'Generating…';
    $('log').innerHTML = '';
    $('bar').style.width = '4%';
    log('Syncing ' + current.meta.name + '…');
    send('import', { doc: current, options: opts() });
  });
  $('close').addEventListener('click', function () { send('close'); });

  window.onmessage = function (e) {
    var m = e.data && e.data.pluginMessage;
    if (!m) return;
    if (m.type === 'progress') {
      var i = STEPS.indexOf(m.step);
      $('bar').style.width = Math.min(95, 10 + (i < 0 ? 0 : i) * 25 + 5) + '%';
      log(m.step + ' · ' + m.detail);
    } else if (m.type === 'done') {
      var s = m.summary;
      $('bar').style.width = '100%';
      log('✓ ' + s.variables + ' variables (' + s.created + ' new, ' + s.updated + ' updated) in ' + s.collections + ' collections', 'ok');
      log('✓ ' + s.textStyles + ' text styles · ' + s.effectStyles + ' effect styles', 'ok');
      if (s.page) log('✓ Style guide on page “' + s.page + '”', 'ok');
      (s.warnings || []).forEach(function (w) { log('⚠ ' + w, 'warn'); });
      log('Done in ' + s.seconds + 's', 'ok');
      finish();
    } else if (m.type === 'error') {
      log('✗ ' + m.message, 'err');
      (m.details || []).forEach(function (d) { log('  ' + d, 'err'); });
      $('bar').style.width = '0';
      finish();
    }
  };
  function finish() { running = false; $('run').disabled = !current; $('run').textContent = 'Generate in Figma'; }

  if (ids.length) selectPreset(ids[0]);
})();
</script>
</body>
</html>
